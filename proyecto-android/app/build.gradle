plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.optimo.navegador'
    compileSdk 34

    defaultConfig {
        applicationId 'com.optimo.navegador'
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName '1.12.0'
    }

    // Firma propia de Optimo: el workflow de Fusion genera apk-build/debug.keystore
    // la primera vez que compila en el repositorio de ESTE proyecto, asi que la clave
    // es distinta de la de cualquier otra app y queda fija entre builds.
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Una sola dependencia: androidx.webkit, para inyectar scripts al inicio del documento (anuncios).
// El resto son APIs del sistema (WebView, DownloadManager...).
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

